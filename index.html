<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天想玩什么游戏？</title>
    <!-- 引入公共样式 -->
    <link rel="stylesheet" href="./0_common/index.css">
</head>
<body>
    <header>
        <h1>今天想玩什么游戏？</h1>
        <button class="join-btn">加入房间</button>
    </header>

    <div class="game-list">
        <!-- 1. 你说我猜 -->
        <a class="game-card" href="./1_talkguess/">
            <div class="game-name">你说我猜</div>
            <div class="game-desc">一个人描述，其他人猜词</div>
        </a>

        <!-- 2. 故事接龙 -->
        <a class="game-card" href="./2_storychain/">
            <div class="game-name">故事接龙</div>
            <div class="game-desc">一人一句，编个离谱的故事</div>
        </a>

        <!-- 3. 你画我猜 -->
        <a class="game-card" href="./3_drawguess/">
            <div class="game-name">你画我猜</div>
            <div class="game-desc">灵魂画手，在线比拼</div>
        </a>

        <!-- 4. 画猜接龙 -->
        <a class="game-card" href="./4_drawchain/">
            <div class="game-name">画猜接龙</div>
            <div class="game-desc">看前一个人画了什么，再传给下一个</div>
        </a>
    </div>

    <!-- 引入公共逻辑 -->
    <script src="./0_common/index.js"></script>

</html>
